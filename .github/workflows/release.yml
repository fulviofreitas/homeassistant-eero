name: Release

# For tags pushed by hand. Releases cut by release-please build their zip in
# release-please.yml: a release created with GITHUB_TOKEN triggers no
# other workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach eero.zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zip the eero integration
        run: |
          cd custom_components/eero
          zip -r "${{ github.workspace }}/eero.zip" . -x '*.pyc' -x '__pycache__/*'

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: eero.zip

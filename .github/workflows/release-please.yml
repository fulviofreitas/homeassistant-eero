name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: no default scopes; each job opts in to what it needs.
permissions: {}

# Serialised, never cancelled: a run may be halfway through writing the
# release pull request or the release.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # release-please writes the release PR, tags and the GitHub release.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build and upload eero.zip
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag-name }}

      - name: Zip the eero integration
        run: |
          cd custom_components/eero
          zip -r "${{ github.workspace }}/eero.zip" . -x '*.pyc' -x '__pycache__/*'

      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: eero.zip
          tag_name: ${{ needs.release-please.outputs.tag-name }}
